[package]
name = "missiondeck"
version = "0.1.0"
description = "本地任务工作台 · Tauri + Vue3 + SQLite"
authors = ["MissionDeck"]
edition = "2021"

# 仅桌面目标（Windows / macOS）
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
