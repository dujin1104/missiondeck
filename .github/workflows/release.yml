name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri (Windows NSIS / MSI)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "任务工作台 ${{ github.ref_name }}"
          releaseBody: |
            本地任务工作台安装包，选择对应平台的附件下载：

            - Windows：`*-setup.exe`（NSIS 安装包）
            - macOS（Apple Silicon）：`*_aarch64.dmg`
            - macOS（Intel / 通用）：`*_x64.dmg` 或 `*_universal.dmg`

            纯本地单机工具，数据仅保存在本机。未做代码签名，macOS 首次打开若被 Gatekeeper 拦截，请右键 App 选择「打开」。
          releaseDraft: true
          prerelease: false
          # 仅打 NSIS：中文产品名在 WiX(MSI) 下会因代码页 1252 报错
          args: "--target x86_64-pc-windows-msvc --bundles nsis"

  build-macos:
    name: Build macOS installer
    runs-on: macos-latest
    needs: build-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-apple-darwin,x86_64-apple-darwin"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri (macOS universal dmg)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "任务工作台 ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: "--target universal-apple-darwin"
